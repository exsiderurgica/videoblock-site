name: NOCTIS RE1 V2 - verify single-camera 3D bake and real browser gameplay
on:
  push:
    branches: [noctis/re1-camera01-v2-20261105]
    paths:
      - '.github/workflows/noctis-re1-camera01-v2-test.yml'
      - 'noctis/re1-camera01-v2/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium
      - name: Run real three-layout 3D screenshot and collision tests
        run: |
          python -m http.server 8123 --bind 127.0.0.1 >/tmp/noctis-v2-server.log 2>&1 &
          python noctis/re1-camera01-v2/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noctis-re1-camera01-v2-chromium-screenshots
          path: noctis/re1-camera01-v2/test-renders/*.png
          if-no-files-found: warn
