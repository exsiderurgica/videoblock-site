name: NOCTIS - verify skinned civilian character preview
on:
  push:
    branches: [noctis/civilian-character-trial]
    paths:
      - '.github/workflows/noctis-civilian-render-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Verify true civilian 3D on both layouts
        run: |
          python -m http.server 8123 --bind 127.0.0.1 >/tmp/noctis-http.log 2>&1 &
          python -m playwright install-deps chromium
          python noctis/re1-civilian/playwright_check.py
      - name: Preserve screenshots from real renderer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noctis-civilian-character-real-screenshots
          path: noctis/re1-civilian/test-renders/*.png
          if-no-files-found: warn
