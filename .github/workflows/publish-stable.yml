name: Publish VideoBlock stable APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-stable.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout downloads branch
        uses: actions/checkout@v4
        with:
          ref: downloads
          fetch-depth: 0

      - name: Rebuild stable APK
        run: |
          cat .transfer/part-* | base64 -d > /tmp/VideoBlock-stable.apk
          unzip -t /tmp/VideoBlock-stable.apk >/dev/null
          rm -f VideoBlock-beta.apk VideoBlock-stable.apk
          mv /tmp/VideoBlock-stable.apk VideoBlock-stable.apk
          rm -rf .transfer
          cat > release.json <<'JSON'
          {
            "stable_status": "BETA 3.7",
            "stable_version": "0.3.7",
            "stable_notes": "Current stable VideoBlock build with the new adaptive app icon and the complete editing feature set.",
            "platform": "Android"
          }
          JSON

      - name: Publish stable build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish VideoBlock Beta 3.7 as stable"
          git push origin downloads
