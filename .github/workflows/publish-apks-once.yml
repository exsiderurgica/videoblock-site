name: Publish VideoBlock APKs once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-apks-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download compiled APK artifacts
        run: |
          curl -L --fail --retry 3 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-5910-8210-98da-8cd5cc87e0a8/raw?se=2026-09-28T13%3A15%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=3bc9c144-ca6e-5b32-90d4-f5245f8d9d36&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T06%3A22%3A56Z&ske=2026-09-29T06%3A22%3A56Z&sks=b&skv=2026-02-06&sig=jrQmOUXPTWwPHGC64OsmZGK%2Buvd0lRjbvKHZc0KHbac%3D' -o stable.zip
          curl -L --fail --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-0948-81f4-955a-b72ea7b2718c/raw?se=2026-09-28T13%3A15%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=79259653-1013-59d1-8cf7-a6cb270b9c33&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T07%3A01%3A16Z&ske=2026-09-29T07%3A01%3A16Z&sks=b&skv=2026-02-06&sig=8wI9WRj5pUFHdrIUP3HSR7kuOkw7qfYetS3nVSRt/uA%3D' -o beta.zip
          mkdir -p stable beta publish
          unzip -j stable.zip -d stable
          unzip -j beta.zip -d beta
          cp stable/VideoBlock-beta3.3.apk publish/VideoBlock-stable.apk
          cp beta/VideoBlock-beta3.6.apk publish/VideoBlock-beta.apk
          cp release.json publish/release.json
          cat > publish/README.md <<'EOF'
          # VideoBlock downloads
          Public compiled APKs only. Android source remains private.
          EOF

      - name: Publish downloads branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd publish
          git init
          git checkout -b downloads
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "publish VideoBlock APK downloads"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin downloads
