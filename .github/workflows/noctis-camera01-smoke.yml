name: NOCTIS Camera 01 - verifica browser reale
on:
  push:
    branches:
      - noctis/camera01-verifica-20261106
    paths:
      - ".github/workflows/noctis-camera01-smoke.yml"
      - "noctis/re1-camera01/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa Chromium e Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verifica Camera 01 su desktop e Android
        run: |
          python -m http.server 8123 --bind 127.0.0.1 > /tmp/noctis-server.log 2>&1 &
          python noctis/re1-camera01/tests/headless_smoke.py
      - name: Salva screenshot autentici e diagnostica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noctis-camera01-prove-browser
          path: noctis/re1-camera01/test-renders/
          if-no-files-found: warn
