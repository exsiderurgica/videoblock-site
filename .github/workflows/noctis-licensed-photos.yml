name: NOCTIS - Licensed Facade Photography
on:
  push:
    branches:
      - noctis/photo-assets-20261105
    paths:
      - '.github/workflows/noctis-licensed-photos.yml'
      - 'noctis/photo-pipeline/**'
permissions:
  contents: write
jobs:
  fetch-photo-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow requests
      - name: Download and transform CC BY-SA photographs
        run: python noctis/photo-pipeline/fetch_licensed_photos.py
      - name: Upload produced licensed materials
        uses: actions/upload-artifact@v4
        with:
          name: noctis-real-photographic-textures
          path: noctis/photos/
      - name: Commit to isolated research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noctis/photos
          git commit -m "NOCTIS: add properly credited photographic reference materials" || echo 'No new assets'
          git push